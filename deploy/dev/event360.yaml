  namespace: event360-dev
  labels:
    app.kubernetes.io/name: srs-config
    app.kubernetes.io/part-of: event360
data:
  srs.conf: |
    listen 1935;
    max_connections 300;
    daemon off;
    srs_log_tank console;
    pid /tmp/srs.pid;
    http_api { enabled on; listen 1985; }
    srt_server { enabled on; listen 8890; }
    vhost __defaultVhost__ {
      srt { enabled on; srt_to_rtmp on; }
      http_hooks {
        enabled on;
        on_publish http://api:3000/v1/streaming/hooks/on_publish?secret=__HOOK_SECRET__;
        on_unpublish http://api:3000/v1/streaming/hooks/on_unpublish?secret=__HOOK_SECRET__;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srs
  namespace: event360-dev
  labels:
    app.kubernetes.io/name: srs
    app.kubernetes.io/part-of: event360
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: srs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs
        app.kubernetes.io/part-of: event360
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      volumes:
        - name: tpl
          configMap:
            name: srs-config
        - name: conf
          emptyDir: {}
      initContainers:
        - name: config
          image: busybox:1.37
          command:
            - sh
            - '-c'
            - sed "s/__HOOK_SECRET__/$STREAM_HOOK_SECRET/g" /tpl/srs.conf > /conf/srs.conf
          env:
            - name: STREAM_HOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: event360-secrets
                  key: STREAM_HOOK_SECRET
          volumeMounts:
            - name: tpl
              mountPath: /tpl
            - name: conf
              mountPath: /conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: srs
          image: ossrs/srs:v6.0-r3
          workingDir: /usr/local/srs
          command:
            - ./objs/srs
            - '-c'
            - /conf/srs.conf
          ports:
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: srt
              containerPort: 8890
              protocol: UDP
            - name: api
              containerPort: 1985
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: rtmp
            periodSeconds: 10
          volumeMounts:
            - name: conf
              mountPath: /conf
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
