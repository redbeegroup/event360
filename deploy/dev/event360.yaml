              mountPath: /tpl
            - name: conf
              mountPath: /conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: srs
          image: ossrs/srs:v6.0-r3
          workingDir: /usr/local/srs
          command:
            - ./objs/srs
            - '-c'
            - /conf/srs.conf
          ports:
            - name: rtmp
              containerPort: 1935
              protocol: TCP
            - name: srt
              containerPort: 8890
              protocol: UDP
            - name: api
              containerPort: 1985
              protocol: TCP
