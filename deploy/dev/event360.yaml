      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: realtime
                port:
                  name: http
    - host: portal.dev.event360.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
    - host: app.dev.event360.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: user-web
                port:
                  name: http
    - host: dev.event360.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: site
                port:
                  name: http
