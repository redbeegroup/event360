spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: srs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: srs
        app.kubernetes.io/part-of: event360
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      volumes:
        - name: tpl
          configMap:
            name: srs-config
        - name: conf
          emptyDir: {}
      initContainers:
        - name: config
          image: busybox:1.37
          command:
            - sh
            - '-c'
            - sed "s/__HOOK_SECRET__/$STREAM_HOOK_SECRET/g" /tpl/srs.conf > /conf/srs.conf
          env:
            - name: STREAM_HOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: event360-secrets
                  key: STREAM_HOOK_SECRET
