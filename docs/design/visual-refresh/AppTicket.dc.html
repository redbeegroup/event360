<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1b1e4b; color: #15172e; font-family: 'Figtree', 'Noto Sans Myanmar', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

          <span style="font-weight: 700; font-size: 15px">Thu, 31 Dec 2026</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">

        <div style="display: flex; flex-direction: column; gap: 2px">

          <span style="font-weight: 700; font-size: 15px">Shwe Pyi Theatre</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">

  <div style="flex-grow: 1"></div>
