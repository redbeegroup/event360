apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event360
  labels:
    {{- include "event360.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- else }}
    # TLS is terminated upstream (NPMPlus); don't redirect plain-HTTP traffic from it to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    # Long-lived WebSocket connections (realtime host)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Sticky sessions for Socket.IO on the realtime host
    nginx.ingress.kubernetes.io/affinity: cookie
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: event360-tls
      hosts:
        {{- range $name, $c := .Values.components }}
        {{- if and $c.enabled $c.host }}
        - {{ $c.host }}.{{ $.Values.domain }}
        {{- end }}
        {{- end }}
  {{- end }}
  rules:
    {{- range $name, $c := .Values.components }}
    {{- if and $c.enabled $c.host }}
    - host: {{ $c.host }}.{{ $.Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: event360-{{ $name }}
                port: { name: http }
    {{- end }}
    {{- end }}
