{{- if .Values.pgbouncer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event360-pgbouncer
  labels:
    {{- include "event360.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pgbouncer.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: event360-pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: event360-pgbouncer
        app.kubernetes.io/part-of: event360
    spec:
      containers:
        - name: pgbouncer
          image: {{ .Values.pgbouncer.image }}
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POOL_MODE
              value: {{ .Values.pgbouncer.poolMode }}
            - name: MAX_CLIENT_CONN
              value: {{ .Values.pgbouncer.maxClientConn | quote }}
            - name: DEFAULT_POOL_SIZE
              value: {{ .Values.pgbouncer.defaultPoolSize | quote }}
            - name: AUTH_TYPE
              value: scram-sha-256
          envFrom:
            - secretRef:
                name: {{ .Values.pgbouncer.existingSecret }}
          readinessProbe:
            tcpSocket: { port: pg }
---
apiVersion: v1
kind: Service
metadata:
  name: event360-pgbouncer
spec:
  selector:
    app.kubernetes.io/name: event360-pgbouncer
  ports:
    - name: pg
      port: 5432
      targetPort: pg
{{- end }}
