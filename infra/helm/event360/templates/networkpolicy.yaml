# Only ingress-nginx may reach public-facing services; pods may talk to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: event360-default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: event360
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: event360
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
