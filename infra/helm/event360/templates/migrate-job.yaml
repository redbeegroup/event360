{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: event360-migrate-{{ .Release.Revision }}
  labels:
    {{- include "event360.labels" . | nindent 4 }}
  annotations:
    # Runs before api/worker roll out; uses DIRECT_DATABASE_URL (bypasses PgBouncer)
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "event360.image" (dict "root" . "image" .Values.components.api.image) }}
          command: ["npx", "prisma", "migrate", "deploy"]
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
{{- end }}
