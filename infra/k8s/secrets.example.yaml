# EXAMPLE ONLY — shape of the Secret every Event 360 namespace needs.
# Real values are created directly in the cluster (via the Portainer API); never commit them.
apiVersion: v1
kind: Secret
metadata:
  name: event360-secrets
  namespace: event360-dev   # and event360-prod
stringData:
  # Shared database, one schema per environment (dev | prod)
  DATABASE_URL: postgresql://dbuser_event360:CHANGE_ME@172.16.16.39:5433/event360?schema=dev&connection_limit=5
  DIRECT_DATABASE_URL: postgresql://dbuser_event360:CHANGE_ME@172.16.16.39:5433/event360?schema=dev
  REDIS_PASSWORD: CHANGE_ME
  REDIS_URL: redis://:CHANGE_ME@redis:6379
  JWT_ACCESS_SECRET: CHANGE_ME
  JWT_REFRESH_SECRET: CHANGE_ME
  # Shared bucket, one prefix per environment
  S3_ENDPOINT: https://CHANGE_ME
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  S3_BUCKET: event360
  S3_PREFIX: dev
