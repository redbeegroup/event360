# EXAMPLE ONLY — shape of the secrets the chart expects. Manage real values with
# External Secrets Operator or Sealed Secrets; never commit real credentials.
apiVersion: v1
kind: Secret
metadata: { name: event360-secrets, namespace: event360-dev }
stringData:
  DATABASE_URL: postgresql://event360:CHANGE_ME@event360-pgbouncer:5432/event360?pgbouncer=true
  DIRECT_DATABASE_URL: postgresql://event360:CHANGE_ME@<pg-cluster-host>:5432/event360
  REDIS_URL: redis://:CHANGE_ME@event360-redis-master:6379
  JWT_ACCESS_SECRET: CHANGE_ME
  JWT_REFRESH_SECRET: CHANGE_ME
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
---
apiVersion: v1
kind: Secret
metadata: { name: event360-pgbouncer, namespace: event360-dev }
stringData:
  DB_HOST: <pg-cluster-host>
  DB_PORT: "5432"
  DB_USER: event360
  DB_PASSWORD: CHANGE_ME
  DB_NAME: event360
