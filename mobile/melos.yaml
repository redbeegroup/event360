name: event360_mobile
packages:
  - apps/*
  - packages/*
scripts:
  analyze:
    run: melos exec -- flutter analyze --no-fatal-infos
  test:
    # Flutter packages use `flutter test`; pure Dart packages (ticketing) use `dart test`.
    run: melos exec --dir-exists=test -- "if grep -q 'sdk: flutter' pubspec.yaml; then flutter test; else dart test; fi"
  gen:api:
    description: Regenerate the Dart API client from the NestJS OpenAPI spec
    run: >
      npx @openapitools/openapi-generator-cli generate
      -i ../apps/api/openapi.json -g dart-dio -o packages/api_client
