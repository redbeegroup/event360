server {
  listen 8080;
  root /usr/share/nginx/html;
  # Always revalidate the entry point so new deploys show up; cache the rest briefly.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  # Crew app (built with --base-href /crew/)
  location = /crew/index.html { add_header Cache-Control "no-cache"; }
  location = /crew/flutter_service_worker.js { add_header Cache-Control "no-cache"; }
  location /crew/ {
    try_files $uri $uri/ /crew/index.html;
    add_header Cache-Control "public, max-age=3600";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=3600";
  }
}
