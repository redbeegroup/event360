name: organizer_app
description: Event 360 Organizer — run your events from your phone
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.8.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  event360_core:
    path: ../../packages/core
  event360_ui:
    path: ../../packages/ui
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
flutter:
  uses-material-design: true
  generate: true
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
