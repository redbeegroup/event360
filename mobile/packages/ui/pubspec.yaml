name: event360_ui
description: Event 360 design system (theme, Myanmar font, shared widgets).
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  fonts:
    # Noto Sans Myanmar (SIL OFL 1.1, see fonts/OFL.txt) — bundled so Myanmar Unicode renders the same on every phone.
    - family: NotoSansMyanmar
      fonts:
        - asset: fonts/NotoSansMyanmar-400.ttf
          weight: 400
        - asset: fonts/NotoSansMyanmar-600.ttf
          weight: 600
        - asset: fonts/NotoSansMyanmar-700.ttf
          weight: 700
    # Bricolage Grotesque (display) and Figtree (body): static instances, SIL OFL 1.1
    # (see fonts/OFL-BricolageGrotesque.txt and fonts/OFL-Figtree.txt). No runtime download.
    - family: BricolageGrotesque
      fonts:
        - asset: fonts/BricolageGrotesque-700.ttf
          weight: 700
        - asset: fonts/BricolageGrotesque-800.ttf
          weight: 800
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-400.ttf
          weight: 400
        - asset: fonts/Figtree-500.ttf
          weight: 500
        - asset: fonts/Figtree-600.ttf
          weight: 600
        - asset: fonts/Figtree-700.ttf
          weight: 700
