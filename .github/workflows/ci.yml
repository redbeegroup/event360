name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: event360, POSTGRES_PASSWORD: pw, POSTGRES_DB: event360 }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U event360" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://event360:pw@localhost:5432/event360
      DIRECT_DATABASE_URL: postgresql://event360:pw@localhost:5432/event360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event360/api exec prisma validate
      - run: pnpm --filter @event360/api exec prisma generate
      - name: Migrations apply cleanly and schema has no drift
        run: |
          pnpm --filter @event360/api exec prisma migrate deploy
          pnpm --filter @event360/api exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" --exit-code
      - run: pnpm --filter @event360/api exec prisma db seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm dependency build infra/helm/event360
      - run: |
          for env in dev staging prod; do
            helm lint infra/helm/event360 -f infra/helm/event360/values-$env.yaml
            helm template e360 infra/helm/event360 -f infra/helm/event360/values-$env.yaml > /dev/null
          done

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

  images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend-web, helm]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ghcr.io/redbeegroup/event360-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
