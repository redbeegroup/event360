name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: event360, POSTGRES_PASSWORD: pw, POSTGRES_DB: event360 }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U event360" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://event360:pw@localhost:5432/event360
      DIRECT_DATABASE_URL: postgresql://event360:pw@localhost:5432/event360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event360/api exec prisma validate
      - run: pnpm --filter @event360/api exec prisma generate
      - name: Migrations apply cleanly and schema has no drift
        run: |
          pnpm --filter @event360/api exec prisma migrate deploy
          pnpm --filter @event360/api exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" --exit-code
      - run: pnpm --filter @event360/api build
      - run: pnpm --filter @event360/api exec prisma db seed
      - name: Kubernetes manifests are up to date
        run: pnpm manifests:check
      - run: pnpm test:manifests
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

  user-app-apk:
    # Debug-signed Android builds — download from the run's Artifacts and install on a phone.
    # Dev builds get a ".dev" app id and "(dev)" name so they install next to the prod ones.
    needs: [flutter]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: user_app, env: dev, api: 'https://api.dev.event360.app', web: 'https://app.dev.event360.app', suffix: '.dev', label: 'Event 360 (dev)' }
          - { app: crew_app, env: dev, api: 'https://api.dev.event360.app', web: 'https://app.dev.event360.app', suffix: '.dev', label: 'Event 360 Crew (dev)' }
          - { app: user_app, env: prod, api: 'https://api.event360.app', web: 'https://app.event360.app', suffix: '', label: 'Event 360' }
          - { app: crew_app, env: prod, api: 'https://api.event360.app', web: 'https://app.event360.app', suffix: '', label: 'Event 360 Crew' }
          - { app: organizer_app, env: dev, api: 'https://api.dev.event360.app', web: 'https://app.dev.event360.app', suffix: '.dev', label: 'Event 360 Organizer (dev)' }
          - { app: organizer_app, env: prod, api: 'https://api.event360.app', web: 'https://app.event360.app', suffix: '', label: 'Event 360 Organizer' }
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      # Push: Firebase client config from repository variables (Settings → Secrets and variables → Actions → Variables).
      # Missing variables → the app is built without push (the in-app inbox still works).
      - run: >-
          flutter build apk --debug --dart-define=APP_VERSION=${{ github.sha }} --dart-define=API_BASE_URL=${{ matrix.api }} --dart-define=WEB_APP_URL=${{ matrix.web }}
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }} --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}
          --dart-define=FIREBASE_SENDER_ID=${{ vars.FIREBASE_SENDER_ID }}
          --dart-define=FIREBASE_APP_ID=${{ matrix.app == 'organizer_app' && (matrix.env == 'dev' && vars.FIREBASE_ANDROID_APP_ID_ORGANIZER_DEV || vars.FIREBASE_ANDROID_APP_ID_ORGANIZER) || (matrix.env == 'dev' && vars.FIREBASE_ANDROID_APP_ID_DEV || vars.FIREBASE_ANDROID_APP_ID) }}
          --dart-define=CREW_WEB_URL=${{ matrix.web }}/crew/
        env:
          E360_APP_ID_SUFFIX: ${{ matrix.suffix }}
          E360_APP_LABEL: ${{ matrix.label }}
      - name: Artifact name
        run: echo "ARTIFACT=event360-${APP//_/-}-${{ matrix.env }}" >> "$GITHUB_ENV"
        env:
          APP: ${{ matrix.app }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}-${{ github.sha }}
          path: mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  user-web-image:
    # Flutter web apps behind nginx: the User app at /, the Crew app at /crew/, the Organizer app at /organizer/.
    # dev → app.dev.event360.app (tag <sha>), prod → app.event360.app (tag <sha>-prod); the API URL is baked in at build time.
    if: github.event_name == 'push'
    needs: [flutter]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { env: dev, api: 'https://api.dev.event360.app', web: 'https://app.dev.event360.app', suffix: '' }
          - { env: prod, api: 'https://api.event360.app', web: 'https://app.event360.app', suffix: '-prod' }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build Flutter web
        working-directory: mobile/apps/user_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --dart-define=APP_VERSION=${{ github.sha }} --dart-define=API_BASE_URL=${{ matrix.api }} --dart-define=WEB_APP_URL=${{ matrix.web }}
      - name: Build Crew web (served by the same image under /crew/)
        working-directory: mobile/apps/crew_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href /crew/ --dart-define=APP_VERSION=${{ github.sha }} --dart-define=API_BASE_URL=${{ matrix.api }}
          mkdir -p ../user_app/build/web/crew
          cp -r build/web/. ../user_app/build/web/crew/
      - name: Build Organizer web (served under /organizer/)
        working-directory: mobile/apps/organizer_app
        run: |
          flutter pub get
          flutter build web --release --no-web-resources-cdn --base-href /organizer/ --dart-define=APP_VERSION=${{ github.sha }} --dart-define=API_BASE_URL=${{ matrix.api }} --dart-define=CREW_WEB_URL=${{ matrix.web }}/crew/
          mkdir -p ../user_app/build/web/organizer
          cp -r build/web/. ../user_app/build/web/organizer/
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Branch tag
        run: echo "BRANCH_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: mobile/apps/user_app
          file: mobile/apps/user_app/Dockerfile.web
          push: true
          tags: |
            ghcr.io/redbeegroup/event360-user-web:${{ github.sha }}${{ matrix.suffix }}
            ghcr.io/redbeegroup/event360-user-web:${{ env.BRANCH_TAG }}${{ matrix.suffix }}

  images:
    # Every push builds images so a branch can be deployed to dev before merging.
    if: github.event_name == 'push'
    needs: [backend-web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        include:
          - { app: api, context: ., file: apps/api/Dockerfile }
          - { app: web, context: ., file: apps/web/Dockerfile }
          - { app: site, context: ., file: apps/site/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Branch tag
        run: echo "BRANCH_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/redbeegroup/event360-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/redbeegroup/event360-${{ matrix.app }}:${{ env.BRANCH_TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  bump-dev:
    # Pin dev to the freshly built images; Portainer GitOps (stack event360-dev) picks up the commit.
    # Runs for main and for the branch the dev stack currently tracks.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/relaxed-dirac-qj6kax')
    needs: [images, user-web-image]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node infra/manifests/generate.mjs --set-tag dev=${{ github.sha }}
      - name: Commit
        run: |
          git config user.name "event360-ci"
          git config user.email "event360-ci@users.noreply.github.com"
          git add infra/manifests/envs.json deploy/dev/event360.yaml
          git diff --cached --quiet || git commit -m "deploy(dev): ${{ github.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Tell Portainer to redeploy dev
        # Portainer's own Git polling does not fire on this cluster, so call the stack webhook.
        env:
          HOOK: ${{ secrets.PORTAINER_DEV_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "PORTAINER_DEV_WEBHOOK secret not set - skipping"; exit 0; fi
          curl -fsS -X POST --retry 3 --retry-delay 5 "$HOOK" && echo "Portainer redeploy triggered"
