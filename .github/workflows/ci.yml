name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: event360, POSTGRES_PASSWORD: pw, POSTGRES_DB: event360 }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U event360" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://event360:pw@localhost:5432/event360
      DIRECT_DATABASE_URL: postgresql://event360:pw@localhost:5432/event360
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @event360/api exec prisma validate
      - run: pnpm --filter @event360/api exec prisma generate
      - name: Migrations apply cleanly and schema has no drift
        run: |
          pnpm --filter @event360/api exec prisma migrate deploy
          pnpm --filter @event360/api exec prisma migrate diff \
            --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$DATABASE_URL" --exit-code
      - run: pnpm --filter @event360/api build
      - run: pnpm --filter @event360/api exec prisma db seed
      - name: Kubernetes manifests are up to date
        run: pnpm manifests:check
      - run: pnpm test:manifests
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: mobile }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: dart pub global activate melos
      - run: melos bootstrap
      - run: melos run analyze
      - run: melos run test

  images:
    # Every push builds images so a branch can be deployed to dev before merging.
    if: github.event_name == 'push'
    needs: [backend-web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Branch tag
        run: echo "BRANCH_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ghcr.io/redbeegroup/event360-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/redbeegroup/event360-${{ matrix.app }}:${{ env.BRANCH_TAG }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  bump-dev:
    # Pin dev to the freshly built images; Portainer GitOps (stack event360-dev) picks up the commit.
    # Runs for main and for the branch the dev stack currently tracks.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/relaxed-dirac-qj6kax')
    needs: [images]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: node infra/manifests/generate.mjs --set-tag dev=${{ github.sha }}
      - name: Commit
        run: |
          git config user.name "event360-ci"
          git config user.email "event360-ci@users.noreply.github.com"
          git add infra/manifests/envs.json deploy/dev/event360.yaml
          git diff --cached --quiet || git commit -m "deploy(dev): ${{ github.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
      - name: Tell Portainer to redeploy dev
        # Portainer's own Git polling does not fire on this cluster, so call the stack webhook.
        env:
          HOOK: ${{ secrets.PORTAINER_DEV_WEBHOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "PORTAINER_DEV_WEBHOOK secret not set - skipping"; exit 0; fi
          curl -fsS -X POST --retry 3 --retry-delay 5 "$HOOK" && echo "Portainer redeploy triggered"
